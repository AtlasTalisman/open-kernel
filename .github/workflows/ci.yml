name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The kernel against the contract's vectors.
      - run: pnpm check
      # The second implementation still writes the same vectors, byte for byte.
      - run: python3 vectors/make.py && git diff --exit-code vectors
